<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💕 约会地点推荐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --pink-light: #fff0f5;
    --pink: #ff6b9d;
    --pink-deep: #e91e63;
    --pink-gradient: linear-gradient(135deg, #fff0f5 0%, #ffd6e7 50%, #ffb3c6 100%);
    --pink-btn: linear-gradient(135deg, #ff6b9d, #ff8fab);
    --shadow: 0 4px 20px rgba(255,107,157,0.25);
    --radius: 16px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
    background: var(--pink-gradient);
    min-height: 100vh;
    color: #333;
    overflow-x: hidden;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    min-height: 100vh;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 30px 0 20px;
  }
  .header h1 {
    font-size: 28px;
    color: var(--pink-deep);
    margin-bottom: 8px;
    text-shadow: 0 2px 10px rgba(255,107,157,0.3);
  }
  .header p {
    font-size: 14px;
    color: #888;
  }
  .heart-icon {
    font-size: 40px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  /* Step Indicator */
  .step-indicator {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin: 20px 0;
  }
  .step-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ddd;
    transition: all 0.3s;
  }
  .step-dot.active {
    background: var(--pink);
    width: 24px;
    border-radius: 5px;
  }
  .step-dot.done {
    background: var(--pink-deep);
  }

  /* Card */
  .card {
    background: rgba(255,255,255,0.95);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px 20px;
    margin-bottom: 16px;
    backdrop-filter: blur(10px);
  }

  /* Screens */
  .screen {
    display: none;
    animation: fadeIn 0.4s ease;
  }
  .screen.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Inputs */
  .input-group {
    margin-bottom: 16px;
  }
  .input-group label {
    display: block;
    font-size: 14px;
    color: var(--pink-deep);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .input-group input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #ffd6e7;
    border-radius: 12px;
    font-size: 16px;
    transition: all 0.3s;
    background: #fff;
  }
  .input-group input:focus {
    outline: none;
    border-color: var(--pink);
    box-shadow: 0 0 0 3px rgba(255,107,157,0.15);
  }
  .input-group .hint {
    font-size: 12px;
    color: #aaa;
    margin-top: 6px;
  }

  /* Buttons */
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: var(--pink-btn);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(255,107,157,0.4);
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255,107,157,0.5);
  }
  .btn:active {
    transform: translateY(0);
  }
  .btn:disabled {
    background: #ddd;
    cursor: not-allowed;
    box-shadow: none;
  }
  .btn-secondary {
    background: white;
    color: var(--pink-deep);
    border: 2px solid var(--pink);
    box-shadow: none;
  }
  .btn-secondary:hover {
    background: var(--pink-light);
  }

  /* Preference Categories */
  .pref-section {
    margin-bottom: 24px;
  }
  .pref-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }
  .pref-card-header p {
    margin-bottom: 0 !important;
  }
  .random-butterfly {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(145deg, #fff8d6, #ffb8df 55%, #cbb4ff);
    box-shadow: 0 5px 0 rgba(191, 105, 198, 0.42), 0 0 18px rgba(255, 232, 163, 0.52);
    cursor: pointer;
    font-size: 24px;
    line-height: 1;
    position: relative;
    transition: transform 0.18s, box-shadow 0.18s;
    animation: butterflyFlutter 1.55s ease-in-out infinite;
  }
  .random-butterfly:hover {
    transform: translateY(-2px) rotate(8deg);
    box-shadow: 0 7px 0 rgba(191, 105, 198, 0.42), 0 0 24px rgba(255, 232, 163, 0.72);
  }
  .random-butterfly:active {
    transform: translateY(4px) scale(0.9) rotate(-10deg);
    box-shadow: 0 2px 0 rgba(191, 105, 198, 0.42), 0 0 14px rgba(255, 232, 163, 0.62);
  }
  .random-butterfly::before,
  .random-butterfly::after {
    content: "✦";
    position: absolute;
    color: #fff2a6;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 0 10px rgba(255, 232, 163, 0.9);
    animation: butterflySpark 1.55s ease-in-out infinite;
  }
  .random-butterfly::before {
    right: -5px;
    top: 2px;
    font-size: 13px;
  }
  .random-butterfly::after {
    left: -6px;
    bottom: 5px;
    font-size: 10px;
    animation-delay: 0.45s;
  }
  .random-butterfly.clicked {
    animation: butterflyClick 0.42s ease;
  }
  .random-butterfly.clicked::before {
    content: "";
    inset: -10px;
    border: 2px solid rgba(255, 239, 163, 0.8);
    border-radius: 50%;
    animation: butterflyRipple 0.46s ease-out;
  }
  @keyframes butterflyFlutter {
    0%, 100% { transform: translateY(0) rotate(-4deg); filter: brightness(1); }
    45% { transform: translateY(-3px) rotate(7deg) scale(1.05); filter: brightness(1.08); }
    70% { transform: translateY(1px) rotate(-2deg); }
  }
  @keyframes butterflySpark {
    0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
    42% { opacity: 1; transform: scale(1.1) rotate(18deg); }
    72% { opacity: 0.35; transform: scale(0.8) rotate(32deg); }
  }
  @keyframes butterflyClick {
    0% { transform: scale(1) rotate(0deg); }
    35% { transform: scale(0.86) rotate(-18deg); }
    70% { transform: scale(1.18) rotate(12deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  @keyframes butterflyRipple {
    0% { opacity: 0.95; transform: scale(0.68); }
    100% { opacity: 0; transform: scale(1.42); }
  }
  .flying-butterfly {
    position: fixed;
    z-index: 20;
    left: 0;
    top: 0;
    pointer-events: none;
    font-size: 28px;
    filter: drop-shadow(0 0 10px rgba(255, 232, 163, 0.9));
    transition: transform 0.9s cubic-bezier(.22,.9,.28,1.08);
  }
  .pref-item.random-target {
    animation: sparklePick 0.72s ease;
  }
  @keyframes sparklePick {
    0% { transform: scale(1); }
    45% { transform: scale(1.08); box-shadow: 0 0 28px rgba(255, 232, 163, 0.8); }
    100% { transform: scale(1); }
  }
  .pref-title {
    font-size: 15px;
    color: var(--pink-deep);
    margin-bottom: 12px;
    padding-left: 8px;
    border-left: 3px solid var(--pink);
  }
  .pref-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .pref-item {
    padding: 12px 14px;
    background: var(--pink-light);
    border: 2px solid transparent;
    border-radius: 10px;
    font-size: 14px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
  }
  .pref-item:hover {
    border-color: var(--pink);
  }
  .pref-item.selected {
    background: white;
    border-color: var(--pink);
    color: var(--pink-deep);
    font-weight: 600;
    box-shadow: 0 2px 10px rgba(255,107,157,0.2);
  }
  .pref-item.disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Meeting Strategy Cards */
  .strategy-cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 16px;
  }
  .strategy-card {
    padding: 18px 16px;
    background: var(--pink-light);
    border: 2px solid transparent;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .strategy-card:hover {
    border-color: var(--pink);
    background: #fff;
  }
  .strategy-card.selected {
    background: white;
    border-color: var(--pink);
    box-shadow: 0 2px 12px rgba(255,107,157,0.2);
  }
  .strategy-icon {
    font-size: 32px;
    flex-shrink: 0;
  }
  .strategy-text {
    flex: 1;
  }
  .strategy-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--pink-deep);
    margin-bottom: 4px;
  }
  .strategy-desc {
    font-size: 13px;
    color: #888;
    line-height: 1.5;
  }
  .strategy-check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #ddd;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: white;
    transition: all 0.3s;
  }
  .strategy-card.selected .strategy-check {
    background: var(--pink);
    border-color: var(--pink);
  }

  /* Results */
  .result-card {
    background: white;
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    border: 2px solid #ffd6e7;
    transition: all 0.3s;
  }
  .result-card:hover {
    border-color: var(--pink);
    transform: translateY(-2px);
  }
  .result-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .result-icon {
    width: 50px;
    height: 50px;
    background: var(--pink-light);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .result-name {
    font-size: 18px;
    font-weight: 700;
    color: #333;
  }
  .result-rating {
    font-size: 13px;
    color: #ff9500;
    margin-top: 2px;
  }
  .result-address {
    font-size: 13px;
    color: #888;
    margin-bottom: 6px;
    display: flex;
    align-items: flex-start;
    gap: 4px;
    flex-direction: column;
  }
  .result-coords {
    font-size: 11px;
    color: #bbb;
    margin-bottom: 10px;
    padding-left: 2px;
  }
  .result-commute {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 8px 0 10px;
  }
  .commute-pill {
    padding: 5px 8px;
    background: #fff7fa;
    border: 1px solid #ffd6e7;
    border-radius: 999px;
    font-size: 12px;
    color: #666;
  }
  .commute-pill.primary {
    color: var(--pink-deep);
    border-color: var(--pink);
    font-weight: 600;
  }
  .result-reason {
    font-size: 14px;
    color: var(--pink-deep);
    background: var(--pink-light);
    padding: 12px;
    border-radius: 10px;
    line-height: 1.6;
  }
  .result-reason::before {
    content: "💡 ";
  }

  /* Route Info */
  .route-section {
    background: white;
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .route-user {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: var(--pink-light);
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .route-avatar {
    width: 40px;
    height: 40px;
    background: var(--pink);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 700;
    font-size: 18px;
  }
  .route-info {
    flex: 1;
  }
  .route-label {
    font-size: 12px;
    color: #888;
  }
  .route-value {
    font-size: 15px;
    font-weight: 600;
    color: #333;
  }
  .route-detail {
    font-size: 13px;
    color: var(--pink-deep);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .route-transit {
    padding: 10px;
    background: #f8f8f8;
    border-radius: 8px;
    margin-top: 8px;
    font-size: 13px;
    color: #666;
  }
  .route-transit span {
    display: inline-block;
    margin-right: 8px;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 40px 20px;
  }
  .loading-icon {
    font-size: 48px;
    animation: bounce 1s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .loading-text {
    font-size: 16px;
    color: var(--pink-deep);
    margin-top: 16px;
  }
  .loading-sub {
    font-size: 13px;
    color: #aaa;
    margin-top: 8px;
  }

  /* Footer */
  .footer-tip {
    text-align: center;
    font-size: 12px;
    color: #bbb;
    margin-top: 20px;
    padding-bottom: 20px;
  }

  /* Error */
  .error-msg {
    color: #e91e63;
    font-size: 13px;
    margin-top: 8px;
    padding: 10px;
    background: #fff0f5;
    border-radius: 8px;
  }
  .api-note {
    font-size: 12px;
    color: #999;
    line-height: 1.6;
    margin-top: 10px;
  }
  .route-link {
    display: inline-block;
    margin-top: 8px;
    color: var(--pink-deep);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
  }

  /* Location Summary */
  .location-summary {
    background: var(--pink-light);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
    font-size: 13px;
    color: #666;
    line-height: 1.8;
  }
  .location-summary strong {
    color: var(--pink-deep);
  }
  .person-count-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .person-count-option {
    padding: 16px 10px;
    background: var(--pink-light);
    border: 2px solid transparent;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
  }
  .person-count-option.selected {
    background: white;
    border-color: var(--pink);
    color: var(--pink-deep);
    font-weight: 700;
    box-shadow: 0 2px 10px rgba(255,107,157,0.2);
  }
  .person-count-number {
    font-size: 24px;
    margin-bottom: 4px;
  }

  /* Dreamy cartoon skin */
  :root {
    --pink-light: #fff1f8;
    --pink: #ff7fbc;
    --pink-deep: #cf3f8d;
    --rose-soft: #ffd9ec;
    --lavender: #bfa7ff;
    --night: #24184f;
    --night-2: #452b83;
    --gold: #ffe8a3;
    --ink: #3a275d;
    --pink-gradient:
      radial-gradient(circle at 18% 16%, rgba(255, 232, 163, 0.52) 0 2px, transparent 3px),
      radial-gradient(circle at 76% 12%, rgba(255, 255, 255, 0.9) 0 1px, transparent 2px),
      radial-gradient(circle at 88% 32%, rgba(255, 203, 227, 0.72) 0 2px, transparent 3px),
      linear-gradient(180deg, #231544 0%, #563195 42%, #ff9aca 100%);
    --pink-btn: linear-gradient(135deg, #ff78b8 0%, #ffa0ce 48%, #ffd0e8 100%);
    --shadow: 0 14px 34px rgba(76, 31, 112, 0.22), 0 3px 0 rgba(255,255,255,0.72) inset;
    --radius: 8px;
  }

  html {
    background: #24184f;
  }

  body {
    position: relative;
    background: var(--pink-gradient);
    color: var(--ink);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 12% 24%, rgba(255,255,255,0.92) 0 1px, transparent 2px),
      radial-gradient(circle at 28% 10%, rgba(255,232,163,0.95) 0 2px, transparent 3px),
      radial-gradient(circle at 62% 18%, rgba(255,255,255,0.8) 0 1px, transparent 2px),
      radial-gradient(circle at 82% 8%, rgba(255,232,163,0.9) 0 2px, transparent 3px),
      radial-gradient(circle at 92% 44%, rgba(255,255,255,0.75) 0 1px, transparent 2px),
      radial-gradient(circle at 22% 78%, rgba(255,232,163,0.95) 0 2px, transparent 3px),
      radial-gradient(circle at 68% 72%, rgba(255,255,255,0.82) 0 1px, transparent 2px);
    opacity: 0.95;
  }

  body::after {
    content: "";
    position: fixed;
    left: -8%;
    right: -8%;
    bottom: -70px;
    height: 180px;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 12% 68%, rgba(255, 238, 247, 0.88) 0 55px, transparent 57px),
      radial-gradient(ellipse at 38% 74%, rgba(255, 218, 239, 0.88) 0 68px, transparent 70px),
      radial-gradient(ellipse at 70% 70%, rgba(238, 222, 255, 0.86) 0 62px, transparent 64px),
      radial-gradient(ellipse at 92% 78%, rgba(255, 239, 248, 0.86) 0 58px, transparent 60px);
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 500px;
    padding: 18px 16px 34px;
  }

  .header {
    padding: 18px 0 12px;
  }

  .heart-icon {
    width: 82px;
    height: 82px;
    margin: 0 auto 12px;
    border: 2px solid rgba(255, 232, 163, 0.9);
    border-radius: 50%;
    background:
      radial-gradient(circle at 62% 34%, #fff9cf 0 8px, transparent 9px),
      radial-gradient(circle at 50% 54%, #fff4a8 0 21px, transparent 22px),
      linear-gradient(145deg, rgba(255,255,255,0.3), rgba(255,145,199,0.48));
    box-shadow: 0 0 0 7px rgba(255,255,255,0.18), 0 16px 32px rgba(27, 14, 67, 0.28);
    color: transparent;
    animation: floatMoon 3.2s ease-in-out infinite;
    position: relative;
  }

  .heart-icon::before {
    content: "✦";
    position: absolute;
    right: -10px;
    top: 8px;
    color: var(--gold);
    font-size: 24px;
    text-shadow: 0 0 12px rgba(255,232,163,0.9);
  }

  .heart-icon::after {
    content: "☾";
    position: absolute;
    left: 20px;
    top: 14px;
    color: #39275e;
    font-size: 42px;
    transform: rotate(-12deg);
  }

  @keyframes floatMoon {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  .header h1 {
    color: #fff9d8;
    font-size: 30px;
    text-shadow: 0 0 10px rgba(255, 244, 184, 0.82), 0 3px 0 rgba(115, 50, 126, 0.34);
  }

  .header p {
    display: inline-block;
    padding: 7px 12px;
    color: #ffe8f5;
    background: rgba(49, 28, 91, 0.42);
    border: 1px solid rgba(255, 232, 163, 0.32);
    border-radius: 999px;
    text-shadow: 0 1px 4px rgba(39, 18, 76, 0.35);
  }

  .step-indicator {
    gap: 7px;
    margin: 14px 0 18px;
  }

  .step-dot {
    width: 9px;
    height: 9px;
    background: rgba(255,255,255,0.48);
    border: 1px solid rgba(255,232,163,0.48);
    box-shadow: 0 0 10px rgba(255, 238, 177, 0.35);
  }

  .step-dot.active {
    width: 28px;
    background: linear-gradient(90deg, #fff1a8, #ff8cc4);
    box-shadow: 0 0 16px rgba(255, 226, 142, 0.75);
  }

  .step-dot.done {
    background: #ffb8d9;
  }

  .card,
  .result-card,
  .route-section {
    background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,240,248,0.92));
    border: 2px solid rgba(255,255,255,0.9);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .card::before,
  .result-card::before,
  .route-section::before {
    content: "✦";
    position: absolute;
    right: 14px;
    top: 10px;
    color: rgba(255, 186, 219, 0.7);
    font-size: 18px;
  }

  .card > p,
  .screen p {
    color: #6f4b88 !important;
    font-weight: 700;
  }

  .input-group label,
  .pref-title,
  .strategy-name,
  .result-name {
    color: var(--pink-deep);
  }

  .input-group input {
    background: #fffaff;
    border: 2px solid #ffd1e8;
    border-radius: var(--radius);
    color: var(--ink);
    box-shadow: 0 3px 0 rgba(255, 216, 235, 0.65);
  }

  .input-group input:focus {
    border-color: #ff89c2;
    box-shadow: 0 0 0 4px rgba(255, 137, 194, 0.2), 0 3px 0 rgba(255, 216, 235, 0.65);
  }

  .input-group .hint,
  .strategy-desc,
  .result-address,
  .route-label,
  .loading-sub {

<script>
// Config
const BAIDU_AK = '7edltr8Ks0Nqaw4RfK7avH4GF7aq6Kvm';

// 偏好类型 → 百度地图地点检索关键词
const PREF_SEARCH_KEYWORDS = {
  '商场逛街': '购物中心',

  '酒吧谈心': '🍷', '看电影': '🎬', '西餐厅': '🍽️',
  '江边/湖边看日落': '🌅', '夜景天台观景': '🌃',
  '密室逃脱': '🔐', '电玩城': '🎮', 'DIY手工': '🎨',
  '剧本杀': '🎭', '卡丁车': '🏎️', '轮滑/射箭': '🎯', '棋牌/桌游': '🀄'
};

// JSONP 工具：百度 Web 服务在浏览器里没有稳定 CORS 响应，静态 HTML 必须走 JSONP。
let jsonpId = 0;
function jsonp(url, timeoutMs = 8000) {
  return new Promise((resolve, reject) => {
    const cbName = '__bmap_cb_' + (++jsonpId) + '_' + Date.now();
    const script = document.createElement('script');
    let timer = null;
    const cleanup = () => {
      if (timer) clearTimeout(timer);
      try { delete window[cbName]; } catch (_) { window[cbName] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    };
    window[cbName] = (data) => {
      cleanup();
      resolve(data);
    };
    script.onerror = () => {
      cleanup();
      reject(new Error('JSONP 请求失败: ' + url));
    };
    timer = setTimeout(() => {
      cleanup();
      reject(new Error('JSONP 请求超时'));
    }, timeoutMs);
    const sep = url.includes('?') ? '&' : '?';
    script.src = url + sep + 'callback=' + cbName;
    document.head.appendChild(script);
  });
}

function buildBaiduApiUrl(path, params) {
  const url = new URL(path, 'https://api.map.baidu.com/');
  Object.entries({ ...params, output: 'json', ak: BAIDU_AK }).forEach(([key, value]) => {
    if (value !== undefined && value !== null && value !== '') {
      url.searchParams.set(key, value);
    }
  });
  return url.toString();
}

async function baiduApi(path, params, timeoutMs = 10000) {
  const url = buildBaiduApiUrl(path, params);
  const data = await jsonp(url, timeoutMs);
  if (!data) throw new Error('百度地图接口未返回数据');
  if (data.status !== 0) {
    const msg = data.message || data.msg || data.status;
    throw new Error(`百度地图接口返回异常: ${msg}`);
  }
  return data;
}

function normalizeLocation(loc) {
  if (!loc) return null;
  const lat = parseFloat(loc.lat);
  const lng = parseFloat(loc.lng);
  return Number.isFinite(lat) && Number.isFinite(lng) ? { lat, lng } : null;
}

// State
let state = {
  peopleCount: 2,
  people: [
    { label: 'A', location: '', coords: null },
    { label: 'B', location: '', coords: null }
  ],
  strategy: 'center',
  selectedPrefs: [],
  recommendations: [],
  selectedPlace: null,
  coordsDest: null,
  targetCoords: null,
  searchRegion: '',
  apiWarning: ''
};

const PERSON_LABELS = ['A', 'B', 'C', 'D'];
const CITY_ALIASES = [
  ['北京', '北京市'], ['上海', '上海市'], ['天津', '天津市'], ['重庆', '重庆市'],
  ['苏州', '苏州市'], ['杭州', '杭州市'], ['南京', '南京市'], ['广州', '广州市'],
  ['深圳', '深圳市'], ['成都', '成都市'], ['武汉', '武汉市'], ['西安', '西安市'],
  ['长沙', '长沙市'], ['郑州', '郑州市'], ['青岛', '青岛市'], ['厦门', '厦门市']
];

function createPeople(count) {
  return PERSON_LABELS.slice(0, count).map((label, i) => ({
    label,
    location: state.people[i]?.location || '',
    coords: state.people[i]?.coords || null
  }));
}

function selectPeopleCount(count) {
  state.peopleCount = count;
  state.people = createPeople(count);
  if (state.strategy !== 'center') {
    const nearIndex = getNearPersonIndex();
    if (nearIndex >= count) state.strategy = 'center';
  }
  document.querySelectorAll('.person-count-option').forEach(option => {
    option.classList.toggle('selected', Number(option.dataset.count) === count);
  });
}

function renderLocationInputs() {
  const box = document.getElementById('locationInputs');
  box.innerHTML = state.people.map(person => `
    <div class="input-group">
      <label>👤 用户${person.label} 的位置</label>
      <input type="text" id="location${person.label}" value="${person.location}" placeholder="例如:北京市石景山区古城" />
      <div class="hint">输入城市、区县或具体地址</div>
    </div>
  `).join('');
  state.people.forEach(person => {
    document.getElementById('location' + person.label).addEventListener('input', updateLocationNextState);
  });
  updateLocationNextState();
}

function updateLocationNextState() {
  const filled = state.people.every(person => {
    const input = document.getElementById('location' + person.label);
    return input && input.value.trim();
  });
  const btn = document.getElementById('btnNext2');
  if (btn) btn.disabled = !filled;
}

function syncPeopleLocations() {
  for (const person of state.people) {
    const input = document.getElementById('location' + person.label);
    person.location = input ? input.value.trim() : person.location;
    person.coords = null;
  }
  if (state.people.some(person => !person.location)) {
    alert('请输入所有人的位置信息');
    return false;
  }
  return true;
}

function renderLocationSummary() {
  document.getElementById('locationSummary').innerHTML = state.people
    .map(person => `用户${person.label}: <strong>${person.location}</strong>`)
    .join('<br>');
}

function renderStrategyCards() {
  const cards = [
    `
      <div class="strategy-card ${state.strategy === 'center' ? 'selected' : ''}" id="strategy-center" onclick="selectStrategy('center')">
        <div class="strategy-icon">🎯</div>
        <div class="strategy-text">
          <div class="strategy-name">折中位置</div>
          <div class="strategy-desc">选在所有人之间的中心点,整体路程更均衡</div>
        </div>
        <div class="strategy-check">${state.strategy === 'center' ? '✓' : ''}</div>
      </div>
    `,
    ...state.people.map(person => {
      const key = 'near' + person.label;
      return `
        <div class="strategy-card ${state.strategy === key ? 'selected' : ''}" id="strategy-${key}" onclick="selectStrategy('${key}')">
          <div class="strategy-icon">🚶‍♀️</div>
          <div class="strategy-text">
            <div class="strategy-name">离 ${person.label} 近一点</div>
            <div class="strategy-desc">${person.label} 少走一点路,更照顾 ${person.label} 的时间</div>
          </div>
          <div class="strategy-check">${state.strategy === key ? '✓' : ''}</div>
        </div>
      `;
    })
  ];
  document.getElementById('strategyCards').innerHTML = cards.join('');
}

// Strategy selection
function selectStrategy(strategy) {
  state.strategy = strategy;
  document.querySelectorAll('.strategy-card').forEach(card => {
    card.classList.remove('selected');
    card.querySelector('.strategy-check').textContent = '';
  });
  const selectedCard = document.getElementById('strategy-' + strategy);
  selectedCard.classList.add('selected');
  selectedCard.querySelector('.strategy-check').textContent = '✓';
}

function getStrategyLabels() {
  return {
    center: '折中位置',
    ...Object.fromEntries(state.people.map(person => ['near' + person.label, `离${person.label}近`]))
  };
}

// Preference selection
function togglePref(el) {
  el.classList.toggle('selected');
}

function randomPickPreference() {
  const items = Array.from(document.querySelectorAll('#screen4 .pref-item'));
  if (!items.length) return;

  const button = document.querySelector('.random-butterfly');
  button.classList.remove('clicked');
  void button.offsetWidth;
  button.classList.add('clicked');
  setTimeout(() => button.classList.remove('clicked'), 460);

  const target = items[Math.floor(Math.random() * items.length)];
  const buttonRect = button.getBoundingClientRect();
  const targetRect = target.getBoundingClientRect();
  const butterfly = document.createElement('div');
  butterfly.className = 'flying-butterfly';
  butterfly.textContent = '🦋';
  butterfly.style.transform = `translate(${buttonRect.left + buttonRect.width / 2 - 14}px, ${buttonRect.top + buttonRect.height / 2 - 14}px) rotate(0deg)`;
  document.body.appendChild(butterfly);

  target.classList.remove('random-target');
  const animate = window.requestAnimationFrame || ((fn) => setTimeout(fn, 16));
  animate(() => {
    butterfly.style.transform = `translate(${targetRect.left + targetRect.width / 2 - 14}px, ${targetRect.top + targetRect.height / 2 - 14}px) rotate(720deg)`;
  });

  setTimeout(() => {
    document.querySelectorAll('#screen4 .pref-item').forEach(item => item.classList.remove('selected'));
    target.classList.add('selected', 'random-target');
    butterfly.remove();
    setTimeout(() => target.classList.remove('random-target'), 760);
  }, 900);
}

// Step navigation
function goToStep(step) {
  if (step === 2) {
    renderLocationInputs();
  }

  if (step === 3) {
    if (!syncPeopleLocations()) return;
    renderLocationSummary();
    renderStrategyCards();
  }

  if (step === 5) {
    const selected = document.querySelectorAll('.pref-item.selected');
    if (selected.length === 0) {
      alert('请至少选择一个偏好类型');
      return;
    }
    state.selectedPrefs = Array.from(selected).map(el => el.textContent);
  }

  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen' + step).classList.add('active');

  document.querySelectorAll('.step-dot').forEach((dot, i) => {
    dot.classList.remove('active', 'done');
    if (i + 1 < step) dot.classList.add('done');
    if (i + 1 === step) dot.classList.add('active');
  });

  const titles = [
    '', '选择人数', '输入你们的位置', '选择地点偏向', '选择约会偏好', '精选推荐', '规划出行路线'
  ];
  document.getElementById('step-title').textContent = titles[step] || '';

  if (step === 5) {
    loadRecommendations();
  }
  if (step === 6) {
    loadRoutes();
  }
}

// 从地址中提取城市名，提高地理编码与检索准确率
function extractCity(address) {
  const m = address.match(/([\u4e00-\u9fa5]+?市)/);
  if (m) return m[1];
  const hit = CITY_ALIASES.find(([alias]) => address.includes(alias));
  return hit ? hit[1] : '';
}

function getSearchCity() {
  for (const person of state.people) {
    const city = extractCity(person.location);
    if (city) return city;
  }
  return '北京市';
}

// 地理编码（Web Service API + JSONP）
async function geocode(address) {
  try {
    const city = extractCity(address) || getSearchCity();
    const data = await baiduApi('/geocoding/v3/', { address, city });
    const location = normalizeLocation(data.result?.location);
    if (location) {
      return location;
    }
    console.warn('[geocode] failed:', address, data);
    return null;
  } catch (e) {
    console.warn('[geocode] error:', address, e);
    return null;
  }
}

async function reverseGeocode(coords) {
  if (!coords) return null;
  try {
    const data = await baiduApi('/reverse_geocoding/v3/', {
      location: `${coords.lat},${coords.lng}`,
      coordtype: 'bd09ll',
      extensions_poi: 0
    });
    return data.result?.addressComponent || null;
  } catch (e) {
    console.warn('[reverseGeocode] error:', coords, e);
    return null;
  }
}

function getInputCities() {
  return Array.from(new Set(state.people.map(person => extractCity(person.location)).filter(Boolean)));
}

function isCrossCityTrip() {
  return getInputCities().length > 1;
}

function getNearPersonIndex() {
  if (!state.strategy.startsWith('near')) return -1;
  return PERSON_LABELS.indexOf(state.strategy.replace('near', ''));
}

function getCenterCoords(coordsList) {
  return {
    lat: coordsList.reduce((sum, item) => sum + item.lat, 0) / coordsList.length,
    lng: coordsList.reduce((sum, item) => sum + item.lng, 0) / coordsList.length
  };
}

// Calculate target coords based on strategy
function calcTargetCoords(coordsList) {
  const nearIndex = getNearPersonIndex();
  if (nearIndex < 0 || !coordsList[nearIndex] || coordsList.length === 1) {
    return getCenterCoords(coordsList);
  }

  const nearCoords = coordsList[nearIndex];
  const otherCoords = coordsList.filter((_, i) => i !== nearIndex);
  const othersCenter = getCenterCoords(otherCoords);
  return {
    lat: nearCoords.lat * 0.7 + othersCenter.lat * 0.3,
    lng: nearCoords.lng * 0.7 + othersCenter.lng * 0.3
  };
}

// 周边地点检索（Web Service API + JSONP）
async function searchPlaces(query, lat, lng, radius = 3000) {
  try {
    const data = await baiduApi('/place/v2/search', {
      query,
      location: `${lat},${lng}`,
      radius,
      region: state.searchRegion || undefined,
      radius_limit: true,
      scope: 2,
      page_size: 20,
      coord_type: 3
    });
    if (Array.isArray(data.results)) {
      return data.results
        .map(p => ({ raw: p, location: normalizeLocation(p.location) }))
        .filter(p => p.location)
        .map(({ raw: p, location }) => ({
          uid: p.uid,
          name: p.name,
          address: p.address,
          location,
          province: p.province || '',
          city: p.city || '',
          area: p.area || '',
          telephone: p.telephone || '',
          overall_rating: p.detail_info?.overall_rating || null,
          price: p.detail_info?.price || '',
          tag: p.detail_info?.tag || '',
          detail_url: p.detail_info?.detail_url || ''
        }));
    }
    console.warn('[searchPlaces] failed:', query, data);
    return [];
  } catch (e) {
    console.warn('[searchPlaces] error:', query, e);
    return [];
  }
}

function getPlaceSearchCenters() {
  const nearIndex = getNearPersonIndex();
  const nearPerson = nearIndex >= 0 ? state.people[nearIndex] : null;
  const wideRadii = isCrossCityTrip() ? [8000, 30000, 50000] : [3000, 8000, 20000];
  if (nearPerson?.coords) {
    return [
      { coords: nearPerson.coords, radius: wideRadii[0] },
      { coords: nearPerson.coords, radius: wideRadii[1] },
      { coords: state.targetCoords, radius: wideRadii[1] },
      { coords: state.targetCoords, radius: wideRadii[2] }
    ];
  }
  return wideRadii.map(radius => ({ coords: state.targetCoords, radius }));
}

// 带关键词映射、策略搜索中心与扩大半径的搜索
async function searchPlacesWithFallback(pref) {
  const keyword = PREF_SEARCH_KEYWORDS[pref] || pref;
  const centers = getPlaceSearchCenters().filter(item => item.coords);
  let results = [];

  for (const item of centers) {
    results = await searchPlaces(keyword, item.coords.lat, item.coords.lng, item.radius);
    if (results.length) break;
  }

  if (results.length === 0 && keyword !== pref) {
    for (const item of centers) {
      results = await searchPlaces(pref, item.coords.lat, item.coords.lng, item.radius);
      if (results.length) break;
    }
  }

  // 标注偏好来源
  return results.map(r => ({ ...r, _prefIcon: PREF_ICONS[pref] || '📍' }));
}

// Haversine distance in km
function haversineDistance(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatDistance(km) {
  if (!Number.isFinite(km)) return '-';
  return km < 1 ? `${Math.round(km * 1000)}m` : `${km.toFixed(km < 10 ? 1 : 0)}km`;
}

function getRatingValue(place) {
  const rating = parseFloat(place.overall_rating || place.rating || 4);
  return Number.isFinite(rating) ? rating : 4;
}

function enrichPlaceMetrics(place) {
  const loc = place.location || normalizeLocation({ lat: place.lat, lng: place.lng });
  const distances = state.people.map(person => (
    person.coords && loc
      ? haversineDistance(person.coords.lat, person.coords.lng, loc.lat, loc.lng)
      : Infinity
  ));
  const targetDistance = state.targetCoords && loc
    ? haversineDistance(state.targetCoords.lat, state.targetCoords.lng, loc.lat, loc.lng)
    : Infinity;
  const finiteDistances = distances.filter(Number.isFinite);
  const balanceGap = finiteDistances.length
    ? Math.max(...finiteDistances) - Math.min(...finiteDistances)
    : Infinity;
  return {
    ...place,
    location: loc,
    distances,
    distA: distances[0],
    distB: distances[1],
    distance: targetDistance,
    balanceGap
  };
}

function getStrategyScore(place) {
  const ratingScore = getRatingValue(place) * 1.2;
  const nearIndex = getNearPersonIndex();
  if (nearIndex >= 0) {
    return ratingScore - (place.distances?.[nearIndex] || Infinity) * 8 - place.distance * 0.6;
  }
  return ratingScore - place.distance * 5 - place.balanceGap * 1.5;
}

function buildPlaceReason(place) {
  if (place.reason) return place.reason;
  const nearIndex = getNearPersonIndex();
  if (nearIndex >= 0) {
    const person = state.people[nearIndex];
    const route = place.routes?.[nearIndex];
    if (route) {
      return `优先照顾 ${person.label} 的真实路线时间，${person.label} 约 ${route.duration} 分钟到达。`;
    }
    return `优先照顾 ${person.label} 的路程，${person.label} 距离约 ${formatDistance(place.distances?.[nearIndex])}。`;
  }
  const distanceText = state.people
    .map((person, i) => `${person.label} 约 ${formatDistance(place.distances?.[i])}`)
    .join('，');
  return `更接近所有人的折中位置，${distanceText}。`;
}

function rankPlaces(places) {
  if (state.people.some(person => !person.coords)) {
    return places
      .map(p => ({ ...p, location: p.location || normalizeLocation({ lat: p.lat, lng: p.lng }) }))
      .map(p => ({ ...p, distances: [], distA: NaN, distB: NaN, distance: NaN, balanceGap: NaN }));
  }

  return places
    .map(enrichPlaceMetrics)
    .filter(p => p.location && p.distances.every(Number.isFinite))
    .map(p => ({ ...p, strategyScore: getStrategyScore(p), reason: buildPlaceReason(p) }))
    .sort((a, b) => b.strategyScore - a.strategyScore);
}

async function refineNearSideByRoute(places) {
  const nearIndex = getNearPersonIndex();
  if (nearIndex < 0) return places;

  const origin = state.people[nearIndex]?.coords;
  if (!origin) return places;

  const candidates = places.slice(0, 8);
  const rest = places.slice(8);
  const enriched = await Promise.all(candidates.map(async place => {
    try {
      const route = await getTransitRoute(origin, place.location);
      if (!route) return place;
      const routes = [...(place.routes || [])];
      routes[nearIndex] = route;
      return {
        ...place,
        routes,
        primaryDuration: route.duration,
        reason: buildPlaceReason({ ...place, routes })
      };
    } catch (e) {
      console.warn('[route refine] failed:', place.name, e);
      return place;
    }
  }));

  enriched.sort((a, b) => {
    const durationA = Number.isFinite(a.primaryDuration) ? a.primaryDuration : Infinity;
    const durationB = Number.isFinite(b.primaryDuration) ? b.primaryDuration : Infinity;
    if (durationA !== durationB) return durationA - durationB;
    return b.strategyScore - a.strategyScore;
  });

  return [...enriched, ...rest];
}

// Load recommendations
async function loadRecommendations() {
  document.getElementById('loadingState').style.display = 'block';
  document.getElementById('resultState').style.display = 'none';
  state.apiWarning = '';
  state.searchRegion = '';

  const strategyLabels = getStrategyLabels();
  document.getElementById('loadingSub').textContent =
    `基于「${strategyLabels[state.strategy]}」,搜索适合约会的地点...`;

  try {
    // 地理编码所有参与者
    const coords = await Promise.all(state.people.map(person => geocode(person.location)));

    if (coords.some(coord => !coord)) {
      throw new Error('无法解析位置,请检查地址是否正确');
    }

    state.people.forEach((person, i) => {
      person.coords = coords[i];
    });
    state.targetCoords = calcTargetCoords(coords);
    const targetAddress = await reverseGeocode(state.targetCoords);
    state.searchRegion = targetAddress?.city || targetAddress?.province || getSearchCity();

    // 并行搜索各个偏好
    const prefList = state.selectedPrefs.slice(0, 4);
    const allResults = await Promise.all(
      prefList.map(pref =>
        searchPlacesWithFallback(pref)
          .then(rs => ({ pref, rs }))
      )
    );

    let allPlaces = [];
    const seen = new Set();
    for (const { pref, rs } of allResults) {
      for (const r of rs) {
        if (!r.uid || seen.has(r.uid)) continue;
        seen.add(r.uid);
        allPlaces.push({ ...r, prefSource: pref, icon: r._prefIcon });
      }
    }

    allPlaces = rankPlaces(allPlaces);
    allPlaces = await refineNearSideByRoute(allPlaces);

    state.recommendations = allPlaces.slice(0, 5);

    // API 无结果时使用本地示例数据兜底
    if (state.recommendations.length === 0) {
      state.apiWarning = '百度地图没有在目标区域找到匹配地点，已展示本地示例结果。';
      state.recommendations = getMockRecommendations();
    }

    renderRecommendations();
  } catch (e) {
    console.error('Load recommendations error:', e);
    state.apiWarning = `百度地图实时搜索暂时失败（${e.message || '网络或浏览器拦截'}），已展示本地示例结果。`;
    state.recommendations = getMockRecommendations();
    renderRecommendations();
  }

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('resultState').style.display = 'block';
}

// 公交路线规划（Web Service API + JSONP）
async function getTransitRoute(from, to) {
  if (!from || !to) return null;
  try {
    const data = await baiduApi('/direction/v2/transit', {
      origin: `${from.lat},${from.lng}`,
      destination: `${to.lat},${to.lng}`,
      tactics_incity: 0,
      coord_type: 'bd09ll'
    });
    if (data.result && Array.isArray(data.result.routes) && data.result.routes.length) {
      const route = data.result.routes[0];
      const durationMin = Math.round((route.duration || 0) / 60);
      const distanceKm = Math.round((route.distance || 0) / 100) / 10;
      // 提取关键换乘信息
      let scheme = '公交/地铁换乘';
      if (Array.isArray(route.steps) && route.steps.length) {
        const transitNames = [];
        for (const stepGroup of route.steps) {
          const subSteps = Array.isArray(stepGroup) ? stepGroup : [stepGroup];
          for (const s of subSteps) {
            if (s.vehicle_info && s.vehicle_info.detail) {
              const name = s.vehicle_info.detail.name;
              if (name && !transitNames.includes(name)) transitNames.push(name);
            }
          }
        }
        if (transitNames.length) {
          scheme = transitNames.slice(0, 3).join(' → ');
        }
      }
      return { duration: durationMin || 30, distance: distanceKm || 5, scheme };
    }
    console.warn('[transit] failed:', data);
    return null;
  } catch (e) {
    console.warn('[transit] error:', e);
    return null;
  }
}

        <div>🗺️ 选址策略：<strong>${strategyLabels[state.strategy]}</strong></div>
        <div>🕐 ${routeList.map(({ person, route }) => `${person.label} 约 ${route.duration} 分钟`).join(' | ')}</div>
        ${destCoordsStr ? `<div style="margin-top:4px;">📌 坐标: <span style="font-size:11px;color:#aaa;">${destCoordsStr}</span></div>` : ''}
        <a class="route-link" href="${baiduMapUrl}" target="_blank" rel="noopener">在百度地图中打开目的地</a>
        <div style="margin-top:8px;">💡 建议提前出发，预留足够的出行时间</div>
      </div>
    </div>
  `;
}

// Restart
function restart() {
  state = {
    peopleCount: 2,
    people: [
      { label: 'A', location: '', coords: null },
      { label: 'B', location: '', coords: null }
    ],
    strategy: 'center',
    selectedPrefs: [],
    recommendations: [], selectedPlace: null,
    coordsDest: null, targetCoords: null,
    searchRegion: '',
    apiWarning: ''
  };
  document.querySelectorAll('.person-count-option').forEach(option => {
    option.classList.toggle('selected', Number(option.dataset.count) === 2);
  });
  document.querySelectorAll('.pref-item').forEach(el => el.classList.remove('selected'));
  goToStep(1);
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  selectPeopleCount(2);
});
</script>
</body>
</html>
